[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crux-terminal"
version = "0.1.0"
description = "Local-first terminal enhancement toolkit"
requires-python = ">=3.11"
dependencies = ["typer>=0.12,<1", "rich>=13,<16"]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1"]

[project.scripts]
crux = "crux.cli.entry:main"

[tool.setuptools.packages.find]
include = ["crux*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
