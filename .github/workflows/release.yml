name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check tag matches package version
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version
          namespace = {}
          exec(Path('crux/__init__.py').read_text(), namespace)
          assert namespace['__version__'] == version
          PY
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q -rs
      - run: python -m build
      - name: Test source distribution
        run: |
          mkdir "$RUNNER_TEMP/crux-sdist"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/crux-sdist"
          cd "$RUNNER_TEMP/crux-sdist"/crux_terminal-*
          python -m pytest -q -rs
      - name: Verify wheel and source installer
        run: |
          python scripts/verify_wheel.py dist/*.whl
          python scripts/verify_installer.py --source .
      - name: Generate artifact checksums
        working-directory: dist
        run: sha256sum *.whl *.tar.gz > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz dist/SHA256SUMS --verify-tag --title "CRUX $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
